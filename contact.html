<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Contacto</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- HEADER -->
    <header>
        <h1>Contacto</h1>
        <p>Formulario de contacto sencillo</p>
    </header>

    <!-- NAV -->
    <nav>
        <ul class="menu">
            <li><a href="index.html">Inicio</a></li>
            <li><a href="contacto.html">Contacto</a></li>
        </ul>
    </nav>

    <!-- MAIN -->
    <main>

        <section>
            <h2>Envíanos un mensaje</h2>

            <form class="formulario">
                
                <label for="nombre">Nombre</label>
                <input type="text" id="nombre" placeholder="Tu nombre">

                <label for="correo">Correo electrónico</label>
                <input type="email" id="correo" placeholder="Tu correo">

                <label for="mensaje">Mensaje</label>
                <textarea id="mensaje" placeholder="Escribe tu mensaje"></textarea>

                <button type="submit">Enviar</button>

            </form>
        </section>

    </main>

    <!-- FOOTER -->
    <footer>
        <p>Derechos Reservados<br>
        &copy; Lic. Roberto García<br>
        Transformación digital para la docencia Técnica - Kodigo Academy & MINEDUCYT</p>
    </footer>

</body>
</html>
